<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çevik Yazılım | Erken Erişim</title>
    <style>
        :root {
            --ana-renk: #4361ee;
            --koyu-renk: #3a0ca3;
            --acik-renk: #f72585;
            --arkaplan: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--arkaplan);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 2rem;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 {
            color: var(--koyu-renk);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .waitlist-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input, button {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: var(--ana-renk);
            box-shadow: 0 0 0 2px rgba(67,97,238,0.2);
        }
        button {
            background: var(--ana-renk);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }
        button:hover {
            background: var(--koyu-renk);
        }
        .success-message {
            color: #4CAF50;
            margin-top: 1rem;
            display: none;
        }
        .sosyal-medya {
            margin-top: 2rem;
        }
        .sosyal-medya a {
            margin: 0 10px;
            color: var(--ana-renk);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Çevik Yazılım Dünyasına Katıl</h1>
        <p>Ürünlerimizin <strong>erken erişim</strong> listesine kaydolun. Birlikte <strong>gelişelim</strong>!</p>

        <form class="waitlist-form" id="waitlistForm">
            <input type="email" id="email" placeholder="E-posta adresinizi girin" required>
            <button type="submit">Katıl</button>
        </form>
        <div class="success-message" id="successMessage">
            ✅ Başarıyla eklendiniz! Sizi bilgilendireceğiz.
        </div>

        <div class="sosyal-medya">
            <a href="https://github.com/sizin-kullaniciadiniz" target="_blank">GitHub</a>
            <a href="mailto:iletisim@sizin-emailiniz.com">İletişim</a>
        </div>
    </div>

    <script>
        document.getElementById("waitlistForm").addEventListener("submit", function(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const successMsg = document.getElementById("successMessage");
            
            // 📌 Gerçek kullanımda: Burada bir API ile e-posta gönderilmeli!
            console.log("Kayıt e-posta:", email);
            
            this.reset();
            successMsg.style.display = "block";
        });
    </script>
</body>
</html>
